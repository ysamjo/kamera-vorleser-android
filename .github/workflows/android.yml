name: Android prüfen
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Android-SDK installieren
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Bauen, Lint und Regressionstests
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --no-daemon --console=plain
      - name: Prüfberichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruefberichte
          path: |
            app/build/reports/
            app/build/test-results/
      - name: Debug-APK sichern
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
